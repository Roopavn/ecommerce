{% extends "main.html" %}
{% block content %}
<div class="row">
<div class="col-lg-6"><div class="box-element">
<form id="form">{% csrf_token %}
<input required class="form-control mb-2" type="text" name="name" placeholder="Name">
<input required class="form-control mb-2" type="email" name="email" placeholder="Email">
<hr>
<input class="form-control mb-2" type="text" name="address" placeholder="Address">
<input class="form-control mb-2" type="text" name="city" placeholder="City">
<input class="form-control mb-2" type="text" name="state" placeholder="State">
<input class="form-control mb-2" type="text" name="zipcode" placeholder="Zip code">
<input class="form-control mb-2" type="text" name="country" value="India" placeholder="Country">
<button id="pay-button" class="btn btn-success btn-block" type="submit">Pay ₹{{ cart_total|floatformat:2 }}</button>
</form></div></div>
<div class="col-lg-6"><div class="box-element">
<a class="btn btn-outline-dark" href="{% url 'cart' %}">← Back to Cart</a><hr><h3>Order Summary</h3><hr>
{% for item in items %}<div class="cart-row"><div style="flex:2">{{ item.product.name }}</div><div style="flex:1">₹{{ item.total|floatformat:2 }}</div><div style="flex:1">x{{ item.quantity }}</div></div>{% endfor %}
<h5>Items: {{ cart_items }}</h5><h5>Total: ₹{{ cart_total|floatformat:2 }}</h5>
</div></div></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.getElementById("form").addEventListener("submit", async function(e) {
 e.preventDefault();
 const form=e.target, button=document.getElementById("pay-button");
 button.disabled=true;
 try {
  const create=await fetch("{% url 'create_payment_order' %}",{method:"POST",headers:{"X-CSRFToken":getCookie("csrftoken")}});
  const payment=await create.json();
  if(!create.ok) throw new Error(payment.error||"Unable to create payment.");
  const options={
   key:payment.key, amount:payment.amount, currency:payment.currency,
   name:"Ecom", description:"E-commerce order", order_id:payment.razorpay_order_id,
   prefill:{name:form.name.value.trim(),email:form.email.value.trim()},
   handler:async function(response){
    const verify=await fetch("{% url 'verify_payment' %}",{
     method:"POST",headers:{"Content-Type":"application/json","X-CSRFToken":getCookie("csrftoken")},
     body:JSON.stringify(response)
    });
    const verified=await verify.json();
    if(!verify.ok) throw new Error(verified.error||"Payment verification failed.");
    const order=await fetch("{% url 'process_order' %}",{
     method:"POST",headers:{"Content-Type":"application/json","X-CSRFToken":getCookie("csrftoken")},
     body:JSON.stringify({
      form:{name:form.name.value.trim(),email:form.email.value.trim()},
      shipping:{address:form.address.value.trim(),city:form.city.value.trim(),state:form.state.value.trim(),zipcode:form.zipcode.value.trim(),country:form.country.value.trim()},
      razorpay_payment_id:response.razorpay_payment_id,razorpay_order_id:response.razorpay_order_id
     })
    });
    const result=await order.json();
    if(!order.ok) throw new Error(result.error||"Unable to create order.");
    document.cookie="cart={};path=/;SameSite=Lax";
    alert("Payment successful. Order #"+result.order_id+" created.");
    window.location.href="{% url 'store' %}";
   }
  };
  const rzp=new Razorpay(options);
  rzp.on("payment.failed",function(response){alert(response.error.description||"Payment failed.");button.disabled=false;});
  rzp.open();
 } catch(err) { alert(err.message); button.disabled=false; }
});
</script>
{% endblock content %}
