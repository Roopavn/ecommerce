{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="row">
    {% for product in products %}
    <div class="col-lg-4 mb-4">
        <img class="thumbnail" src="{{ product.imageURL }}" alt="{{ product.name }}">
        <div class="box-element product">
            <h6><strong>{{ product.name }}</strong></h6>
            <hr>
            <button data-product="{{ product.id }}" data-action="add" class="btn btn-outline-secondary add-btn update-cart">
                Add to Cart
            </button>
            <h4 style="display:inline-block;float:right">₹{{ product.price|floatformat:2 }}</h4>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p>No products are available.</p>
    </div>
    {% endfor %}
</div>
{% endblock content %}
